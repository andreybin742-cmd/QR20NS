<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поздравление от НОВОСИБИРСКОЙ ДИРЕКЦИИ СВЯЗИ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            max-width: 500px;
        }
        .greeting {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .greeting h1 { font-size: 24px; margin-bottom: 10px; }
        .greeting p { font-size: 18px; }
        .image-container img {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        .footer { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="greeting">
            <h1>НОВОСИБИРСКАЯ ДИРЕКЦИЯ СВЯЗИ</h1>
            <p>🎉 С Праздником! 🎉</p>
        </div>
        <div class="image-container">
            <img src="834a0968-3b75-4378-ad33-b45b9fc6bb3a.jfif" alt="Поздравление">
        </div>
        <div class="footer">
            <p>Вечная открытка от нашей команды 💚</p>
        </div>
    </div>
</body>
</html>
